<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Spillkveld rundt bordet</title>
  <desc id="desc">Illustrasjon av et spillbord med kort, terninger og turneringsbracket</desc>
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2f6b52"/>
      <stop offset="55%" stop-color="#1f4d3b"/>
      <stop offset="100%" stop-color="#143328"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5a34"/>
      <stop offset="100%" stop-color="#5c3820"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1a14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#felt)"/>
  <ellipse cx="600" cy="420" rx="460" ry="250" fill="#184433" opacity="0.55"/>
  <ellipse cx="600" cy="420" rx="420" ry="220" stroke="#c9a26b" stroke-width="18" fill="none" opacity="0.35"/>

  <!-- Table wood edge hint -->
  <path d="M120 420c40-180 250-300 480-300s440 120 480 300c-40 180-250 300-480 300S160 600 120 420Z" stroke="url(#wood)" stroke-width="28" opacity="0.25"/>

  <!-- Playing cards -->
  <g filter="url(#soft)" transform="translate(340 300) rotate(-18)">
    <rect width="120" height="168" rx="12" fill="#f7f2e8"/>
    <rect x="12" y="12" width="96" height="144" rx="8" stroke="#d8c9b0" stroke-width="2"/>
    <circle cx="36" cy="40" r="10" fill="#c45c4a"/>
    <path d="M70 70h30v70H50V90c0-12 8-20 20-20Z" fill="#1f4d3b" opacity="0.85"/>
  </g>
  <g filter="url(#soft)" transform="translate(430 280) rotate(8)">
    <rect width="120" height="168" rx="12" fill="#f7f2e8"/>
    <rect x="12" y="12" width="96" height="144" rx="8" stroke="#d8c9b0" stroke-width="2"/>
    <text x="60" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#c45c4a">A</text>
  </g>

  <!-- Dice -->
  <g filter="url(#soft)" transform="translate(700 360)">
    <rect width="78" height="78" rx="14" fill="#f3efe6" transform="rotate(12 39 39)"/>
    <circle cx="28" cy="34" r="7" fill="#1a2e26"/>
    <circle cx="52" cy="54" r="7" fill="#1a2e26"/>
    <circle cx="40" cy="44" r="7" fill="#1a2e26"/>
  </g>
  <g filter="url(#soft)" transform="translate(780 400)">
    <rect width="64" height="64" rx="12" fill="#e8945a" transform="rotate(-16 32 32)"/>
    <circle cx="24" cy="30" r="6" fill="#1a2e26"/>
    <circle cx="42" cy="46" r="6" fill="#1a2e26"/>
  </g>

  <!-- Mini bracket -->
  <g transform="translate(820 220)" stroke="#e8d7b8" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M0 20h70v40H0"/>
    <path d="M0 120h70v40H0"/>
    <path d="M70 40h40v80H70"/>
    <path d="M110 80h50"/>
    <circle cx="170" cy="80" r="10" fill="#e8945a" stroke="none"/>
  </g>

  <!-- Soft light wash -->
  <ellipse cx="600" cy="180" rx="380" ry="120" fill="#f4efe4" opacity="0.08"/>
</svg>
